name: Build and Push Docker Image (tag + latest)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '*.md'

env:
  PROJECT_NAME: botspace/admin

permissions:
  contents: write

jobs:
  build-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Write build-time env
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.botspace.uz' }}
          NEXT_PUBLIC_API_PREFIX=${{ vars.NEXT_PUBLIC_API_PREFIX || '/api/v2' }}
          NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://botspace.uz' }}
          SESSION_COOKIE_NAME=bm_session
          SESSION_COOKIE_DOMAIN=.botspace.uz
          SESSION_SECRET=build-time-placeholder-not-used-at-runtime
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ env.SHORT_SHA }}
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet || git commit -m "deploy: update image tag to ${{ env.SHORT_SHA }}"
          git push origin main
